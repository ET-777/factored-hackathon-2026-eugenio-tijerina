[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factored-bank-service"
version = "0.0.1"
description = "Local scaffold for an evaluated bilingual banking service prototype"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
routing-experiment = ["scikit-learn==1.8.0", "numpy==2.2.6", "scipy==1.16.3"]

[tool.setuptools]
packages = ["bank_service"]

[tool.setuptools.package-data]
bank_service = ["web/*.html", "web/*.css", "web/*.js", "resources/*.json"]
